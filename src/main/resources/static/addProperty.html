    <script>

function convertDriveUrl(url) {
    const match = url.match(/\/d\/([a-zA-Z0-9_-]+)\//);
    if (match && match[1]) {
        const fileId = match[1];
        const embedLink = `https://drive.google.com/file/d/${fileId}/preview`;
        return embedLink;
    } else {
        return url;
    }
}
  
      $("#addProperty").submit(function (event) {
          event.preventDefault();
  
          // Convert main image URL
          const mainImageUrl = convertDriveUrl($("#main-picture").val());
  
          let realEstate = {
              name: $("#name").val(),
              saleOrRent: $("#saleOrRent").val(),
              realEstateType: $("#realEstateType").val(),
              bathrooms: $("#bathrooms").val(),
              bedrooms: $("#bedrooms").val(),
              city: $("#city").val(),
              price: $("#price").val(),
              area: $("#area").val(),
              description: $("#description").val(),
              availability: true,
              userId: localStorage.getItem("id"),
              address: $("#address").val(),
              mainImage: mainImageUrl // Use the converted URL
          };
  
          $.ajax({
              type: "POST",
              url: "/realEstate/addRealEstate",
              contentType: "application/json",
              data: JSON.stringify(realEstate),
              success: function () {
                  alert("Property saved successfully!");
                  window.location.href = "propertiesList.html";
              },
              error: function (error) {
                  alert("Error saving property: ", error);
              }
          });
      });
  </script>
