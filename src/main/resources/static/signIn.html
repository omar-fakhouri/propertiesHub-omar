<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Prime Estates - Real Estate Store</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Inter:wght@700;800&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="css/style.css" rel="stylesheet">
    <link href="css/login.css" rel="stylesheet">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<div style="position: relative; height: 100vh; width: 100%; display: flex; align-items: center; justify-content: center; margin: 0; padding: 0; overflow: hidden;">
    <div style="background-image: url(img/qwew.png); background-size: cover; background-position: center; filter: blur(15px); position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;"></div>
    
    <div class="container" id="container" style="background: rgba(255, 255, 255, 0.9); border-radius: 10px; padding: 20px; z-index: 1; position: relative;">
        <div class="form-container sign-up-container">
            <form action="#">
                <h1>Create Account</h1>
                <div class="social-container">
                    <a href="#" class="social"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="social"><i class="fab fa-google-plus-g"></i></a>
                    <a href="#" class="social"><i class="fab fa-linkedin-in"></i></a>
                </div>
                <span>or use your email for registration</span>
                <input type="text" placeholder="Name" />
                <input type="email" placeholder="Email" />
                <input type="password" placeholder="Password" />
                <button>Sign Up</button>
            </form>
        </div>
        <div class="form-container sign-in-container">
            <form id="signInForm">
                <h1>LogIn</h1>
                <br>
                <input type="text" placeholder="Email" id="email">
                <input type="password" placeholder="Password" id="password">
                <div id="error-message" style="color: rgb(254, 35, 35); display: none; margin-bottom: 5px; font-weight: 500;">Wrong email or password.</div>
                <button>LogIn</button>
            </form>
        </div>
        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h1>Welcome Back!</h1>
                    <p>To keep connected with us please login with your personal info</p>
                    <button class="ghost" id="signIn">Sign In</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h1 style="font-size: 35px;">SignUp</h1>
                    <p>Enter your personal details and start your journey with us</p>
                    <button class="ghost" id="signUp"><a href="signUp.html">SignUp</a></button>
                    <br>
                    <button class="ghost"><a class="ghost" href="index.html" style="margin:15px 0">Back home</a></button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="js/signIn.js"></script>
<script>
    $(document).ready(function () {
        const button = $("#signInForm button");
        const originalPos = button.position(); // Store the original position
        const maxMove = 100; // Max move range from original position

        button.mouseenter(function () {
            let newX, newY;
            let distanceThreshold = maxMove * 0.7; // Ensures it moves far, at least 70% of maxMove

            do {
                // Generate random offsets within ±100px from the original position
                newX = originalPos.left + (Math.random() * maxMove * 2 - maxMove);
                newY = originalPos.top + (Math.random() * maxMove * 2 - maxMove);
            } while (
                Math.abs(newX - button.position().left) < distanceThreshold &&
                Math.abs(newY - button.position().top) < distanceThreshold
            );

            button.css({
                position: "absolute",
                transition: "left 0.15s ease, top 0.15s ease", // Faster movement (0.15s instead of 0.3s)
                left: newX + "px",
                top: newY + "px"
            });
        });
    });
</script>

</body>
</html>
