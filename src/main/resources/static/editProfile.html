                </ol>
            </nav>
            <!-- /Breadcrumb -->

            <div class="row gutters-sm">

                <!--editing profile start-->
                <div class="container">
                    <div class="main-body">
                        <div class="row">

                            <div class="col-lg-8" style="margin-bottom:20px">
                                <div class="card">
                                    <div class="card-body">
                                        <form id="editProfile">
                                        <div class="row mb-3">
                                            <div class="col-sm-3">
                                                <h6 class="mb-0">user Name</h6>
                                            </div>
                                            <div class="col-sm-9 text-secondary">
                                                <input type="text" class="form-control" id="userName-ed">
                                            </div>
                                        </div>
                                        <div class="row mb-3">
                                            <div class="col-sm-3">
                                                <h6 class="mb-0">Email</h6>
                                            </div>
                                            <div class="col-sm-9 text-secondary">
                                                <input type="text" class="form-control"  id="email-ed" >
                                            </div>
                                        </div>
                                        <div class="row mb-3">
                                            <div class="col-sm-3">
                                                <h6 class="mb-0">phone number</h6>
                                            </div>
                                            <div class="col-sm-9 text-secondary">
                                                <input type="text" class="form-control" id="phoneNumber-ed">
                                            </div>
                                        </div>
                                        <div class="row mb-3">
                                            <div class="col-sm-3">
                                                <h6 class="mb-0">password</h6>
                                            </div>
                                            <div class="col-sm-9 text-secondary">

                                            </div>
                                        </div>
                                        <div class="col-sm-9 text-secondary">

                                        </div>
                                     </form>
                                    </div>

                            </div>
                        </div>
                    </div>

                <!--editing profile end-->
            </div>

        </div>
    </div>

    <!--profile end-->
    <script>
        $.ajax({
        type: "Get",
        url: "/users/findUserId/"+localStorage.getItem("id"),
        success: function (user) {
         document.getElementById("phoneNumber-ed").value = user.phoneNumber;
         document.getElementById("userName-ed").value = user.userName;
         document.getElementById("password-ed").value = user.password;
         document.getElementById("email-ed").value = user.email;
        },
        error: function (error) {
            console.log("Error finding your account", error);
        }
    });
        function logout(){
        localStorage.clear();
          window.location.href="../index.html";
        }




$("#editProfile").submit(function (event) {
   event.preventDefault();
   userName= $("#userName-ed").val();
   email= $("#email-ed").val();
   phoneNumber= $("#phoneNumber-ed").val();
   password = $("#password-ed").val();

   $.ajax({
   type: "PUT",
   url: "/users/editUser/"+localStorage.getItem("id")+"/"+userName+"/"+email+"/"+phoneNumber+"/"+password,
   contentType: "application/json",
   success: function () {
   alert("Profile edited successfully!");
     window.location.href="profile.html";
},
   error: function (error) {
   alert("Error editing your profile: ", error);
}
});
});
    </script>
