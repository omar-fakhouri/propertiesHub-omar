<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>PropertiesHub - real Estate store</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">


    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Inter:wght@700;800&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="css/style.css" rel="stylesheet">
    <link href="css/login.css" rel="stylesheet">


    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

</head>

<body>
    <div style="background: linear-gradient(to bottom, #cfdfff 650px, #ffffff);height:100vh;width:100%;display: flex;align-items: center;">


<div class="container" id="container">
    <div class="form-container sign-up-container">
        <form action="#">
            <h1>Create Account</h1>
            <div class="social-container">
                <a href="#" class="social"><i class="fab fa-facebook-f"></i></a>
                <a href="#" class="social"><i class="fab fa-google-plus-g"></i></a>
                <a href="#" class="social"><i class="fab fa-linkedin-in"></i></a>
            </div>
            <span>or use your email for registration</span>
            <input type="text" placeholder="Name" />
            <input type="email" placeholder="Email" />
            <input type="password" placeholder="Password" />
            <button>Sign Up</button>
        </form>
    </div>
    <div class="form-container sign-in-container">
        <form id="signUpForm">
            <h1>SignUp</h1>
            <br>
            <input type="text" placeholder="userName" id="userName" maxlength="15" minlength="2">
            <input type="email" placeholder="Email" id="email">
            <input type="password" placeholder="Password" id="password" minlength="7" maxlength="25">
            <input type="password" placeholder="Confirm password" id="passwordC" >
            <input type="number" placeholder="phoneNumber" id="phoneNumber" minlength="5" maxlength="15">
            <button>SignUp</button>
        </form>
    </div>
    <div class="overlay-container">
        <div class="overlay">
            <div class="overlay-panel overlay-left">
                <h1>Welcome Back!</h1>
                <p>To keep connected with us please login with your personal info</p>
                <button class="ghost" id="signIn">Sign In</button>
            </div>
            <div class="overlay-panel overlay-right">
                <h1>Login</h1>
                <p>Search for your future house with the specifications you want easly by our web.</p>
                <button class="ghost" id="signUp" > <a class="ghost" href="signIn.html">login</a></button>
                <br>
                <button class="ghost"  > <a class="ghost" href="index.html" style="margin:15px 0">Back home</a></button>

            </div>
        </div>
    </div>
</div>
</div>
<script>
    localStorage.removeItem("id");
   $("#signUpForm").submit(function (event) {
  event.preventDefault();
  if( $("#password").val()== $("#passwordC").val()){
  let user = {
  userName: $("#userName").val(),
  email: $("#email").val(),
  phoneNumber: $("#phoneNumber").val(),
  password : $("#password").val(),
  //realEstateCount:0
};
  $.ajax({
  type: "POST",
  url: "/users/addUser",
  contentType: "application/json",
  data: JSON.stringify(user),
  success: function () {
   window.location.href="signIn.html"

},
  error: function (error) {
  alert("Error saving person: ", error);
}
});
  }else
  alert("Passwords do not match.")
});
</script>

<script src="js/signIn.js"></script>
</body>

</html>
